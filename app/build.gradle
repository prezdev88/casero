apply plugin: 'com.android.application'

android {
    namespace 'cl.casero' // Requerido desde AGP 8+
    compileSdk 34

    defaultConfig {
        applicationId "cl.casero"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.7.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
    }


    lint {
        baseline = file("lint-baseline.xml")
    }
}

dependencies {
    //implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Moderno reemplazo para appcompat
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // ConstraintLayout moderno
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Test unitarios
    testImplementation 'junit:junit:4.13.2'

    // MPAndroidChart se mantiene igual
    implementation 'com.github.PhilJay:MPAndroidChart:v3.0.0'

    // Unirest actualizado
    implementation 'com.konghq:unirest-java:3.14.5'

    // JavaMail (ok)
    implementation 'com.sun.mail:android-mail:1.6.3'
    implementation 'com.sun.mail:android-activation:1.6.3'
}
